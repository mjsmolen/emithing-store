<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emithing – Pretty Little Things</title>
<style>
  :root {
    --cream: #fdf3ee;
    --berry: #b5385f;
    --lavender: #a89bd4;
    --gold: #d9a441;
    --text: #4a3b3f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: linear-gradient(160deg, var(--cream) 0%, #f7e9f0 100%);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    color: var(--text);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    text-align: center;
    max-width: 480px;
    width: 100%;
  }
  .logo {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 12px 40px rgba(181, 56, 95, 0.18);
    margin-bottom: 32px;
  }
  h1 {
    font-size: 1.6rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--berry);
    margin: 0 0 12px;
    font-weight: 600;
  }
  p.tagline {
    font-size: 1.05rem;
    color: var(--text);
    margin: 0 0 28px;
    opacity: 0.85;
  }
  .badge {
    display: inline-block;
    padding: 10px 26px;
    border: 1.5px solid var(--lavender);
    border-radius: 999px;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--lavender);
    margin-bottom: 20px;
  }
  .sparkle {
    color: var(--gold);
    font-size: 1.2rem;
    margin: 0 6px;
  }
  footer {
    margin-top: 40px;
    font-size: 0.8rem;
    opacity: 0.5;
  }
</style>
</head>
